# claude-openers.conf
# How `prefix + C-f` opens the file you pick.
#
#   <ext>  <mode>  <command...>
#     mode = split -> full-height left tmux pane running:  <command> <file>
#            gui   -> launch a non-terminal app detached (no split)
#     "*" is the fallback for any extension not listed.
#
# One extension per line. <command...> may include args (e.g. bat --paging=always).
# Edit freely, then just re-run the picker (no tmux reload needed).

md        split  leaf
markdown  split  leaf
txt       split  nvim
py        split  nvim
ts        split  nvim
tsx       split  nvim
js        split  nvim
jsx       split  nvim
go        split  nvim
rs        split  nvim
sh        split  nvim
json      split  nvim
yaml      split  nvim
yml       split  nvim
toml      split  nvim
sql       split  nvim
tf        split  nvim
css       split  nvim
conf      split  nvim

html      gui    open
pdf       gui    open
png       gui    open
jpg       gui    open
jpeg      gui    open
gif       gui    open
svg       gui    open

*         split  bat --paging=always
